name: Test
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t test-cargo-deny .

      - name: Run list
        run: |
          docker run -v $PWD/test:/test test-cargo-deny \
            "" \
            "" \
            "" \
            "" \
            "false" \
            "" \
            --log-level warn \
            --manifest-path test/Cargo.toml \
            "" \
            list \
            ""

      - name: Run check
        run: |
          docker run -v $PWD/test:/test test-cargo-deny \
            1.70.0 \
            "" \
            "" \
            "" \
            "false" \
            "" \
            --log-level warn \
            --manifest-path test/Cargo.toml \
            --all-features \
            check \
            ""

      - name: Run check w/rust-toolchain.toml
        run: |
          mv ./test/rt.toml ./rust-toolchain.toml
          docker run -v $PWD:/test test-cargo-deny \
            "" \
            "" \
            "" \
            "" \
            "false" \
            "" \
            --log-level warn \
            --manifest-path test/Cargo.toml \
            check \
            ""

      - name: Run list with output file
        run: |
          output_dir="$(mktemp -d)"
          docker run -v $PWD/test:/test -v "$output_dir:/output" \
            -e GITHUB_OUTPUT=/output/github-output \
            test-cargo-deny \
            "" \
            "" \
            "" \
            "" \
            "false" \
            "/output/licenses.txt" \
            --log-level warn \
            --manifest-path test/Cargo.toml \
            "" \
            list \
            ""
          test -s "$output_dir/licenses.txt"
          grep '^output-file=/output/licenses.txt$' "$output_dir/github-output"

      - name: Run check with SARIF output file
        run: |
          output_dir="$(mktemp -d)"
          docker run -v $PWD/test:/test -v "$output_dir:/output" test-cargo-deny \
            "" \
            "" \
            "" \
            "" \
            "false" \
            "/output/cargo-deny.sarif" \
            --log-level warn \
            --manifest-path test/Cargo.toml \
            "--format sarif --all-features" \
            check \
            ""
          grep '"version": "2.1.0"' "$output_dir/cargo-deny.sarif"
